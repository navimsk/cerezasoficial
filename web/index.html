<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Contador de cajas del packing: producción en vivo, historial y proyecciones." />
    <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0e0d" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Cajas · Packing</title>
    <script>
      // Aplica el tema guardado antes de pintar (evita parpadeo)
      try {
        var t = localStorage.getItem('cajas.tema');
        if (t === 'claro') document.documentElement.dataset.theme = 'light';
        else if (t === 'oscuro') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
